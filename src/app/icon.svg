<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
  </defs>

  <!-- Background container with rounded corners -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Subtle corner accent dot -->
  <circle cx="50" cy="14" r="2.5" fill="#38bdf8" />

  <!-- Brand text 'RU' -->
  <text
    x="32"
    y="40"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Geist Sans', sans-serif"
    font-size="25"
    font-weight="800"
    letter-spacing="-0.5"
    fill="url(#textGrad)"
    text-anchor="middle"
    dominant-baseline="central"
  >RU</text>
</svg>

